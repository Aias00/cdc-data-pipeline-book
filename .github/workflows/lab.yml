name: Real CDC integration baseline
on:
  push:
    paths: ['lab/**', '.github/workflows/lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-cdc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute actual MySQL binlog and Debezium Kafka pipeline
        env:
          CDC_COMPOSE_PROJECT: cdc-book-${{ github.run_id }}
          BOOK_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: sh lab/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-cdc-evidence
          path: lab/evidence/
