<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">CDC同步边界与恢复证据</title><desc id="desc">MySQL经Debezium进入Kafka，消费者先提交PostgreSQL投影再确认位点；两步之间崩溃会重复投递，由幂等历史收敛。</desc><rect width="1200" height="530" rx="24" fill="#f3f6f7"/><g font-family="sans-serif" fill="#1b3346"><text x="55" y="67" font-size="30">事实、交付与投影各自拥有提交边界</text><g fill="#e3edf1" stroke="#4d8199" stroke-width="3"><rect x="50" y="125" width="240" height="130" rx="15"/><rect x="330" y="125" width="240" height="130" rx="15"/><rect x="610" y="125" width="240" height="130" rx="15"/><rect x="890" y="125" width="260" height="130" rx="15"/></g><g font-size="27" text-anchor="middle"><text x="170" y="175">MySQL</text><text x="170" y="216">权威源与 binlog</text><text x="450" y="175">Debezium</text><text x="450" y="216">快照 + 增量</text><text x="730" y="175">Kafka</text><text x="730" y="216">分区内有序</text><text x="1020" y="175">PostgreSQL</text><text x="1020" y="216">查询投影与历史</text></g><g fill="none" stroke="#3c829f" stroke-width="4"><path d="M290 190H330m-12-8 12 8-12 8M570 190H610m-12-8 12 8-12 8M850 190H890m-12-8 12 8-12 8"/><path d="M1010 260V325H730V260"/></g><text x="590" y="370" font-size="26">① 投影事务提交 → ② Kafka 位点确认</text><text x="65" y="435" font-size="25">窗口内 SIGKILL → 重启重复投递 → 同库幂等处理</text><text x="65" y="480" font-size="24" fill="#536f7c">完整对账与隔离重建负责验证内容；跨系统不声称原子提交。</text></g></svg>
